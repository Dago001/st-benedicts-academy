name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      MYSQL_HOST: 127.0.0.1
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, fileinfo, gd
      - name: PHP syntax check
        run: |
          if find . -name '*.php' -not -path './assets/vendor/*' -print0 | xargs -0 -n1 -P4 php -l 2>&1 | grep -E '^(PHP )?(Parse|Fatal) error'; then exit 1; fi
      - name: Unit tests
        run: php tests/unit_test.php
      - name: Create database and seed
        run: |
          mkdir -p logs
          mysql -uroot -e "CREATE DATABASE st_benedicts_academy CHARACTER SET utf8mb4"
          mysql -uroot st_benedicts_academy < sql/database.sql
          php tests/seed.php
      - name: Migration is idempotent
        run: php scripts/migrate.php && php scripts/migrate.php
      - name: Chatbot tests
        run: php tests/chatbot_test.php
      - name: SMTP mailer test
        run: python3 tests/smtp_test.py
      - name: Start app
        run: |
          nohup php -S 127.0.0.1:8080 router.php > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/health && break || sleep 1; done
      - name: End-to-end tests
        run: python3 tests/e2e.py
      - name: Crawl every page for every role
        run: bash tests/crawl.sh
      - name: Internal link check
        run: python3 tests/linkcheck.py
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-php${{ matrix.php }}
          path: |
            /tmp/php-server.log
            logs/error.log
